[project]
name = "pedalboard"
version = "0.1.0"
description = "Data-driven planner for the owner's pedalboards"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
]

[project.scripts]
pb = "pb:main"   # uv run pb <command>: one entry point for the scripts (pb/__init__.py)

[build-system]
requires = ["uv_build>=0.9.26,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pb"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# no third-party plugin autoload: a global PYTHONPATH (e.g. ROS) would otherwise inject its pytest plugins
addopts = "--disable-plugin-autoload"
testpaths = ["tests"]
